name: Fetch Threat Intelligence Data

on:
  schedule:
    # Runs every 4 hours
    - cron: "0 */4 * * *"
  # Allow manual trigger from the GitHub Actions UI
  workflow_dispatch:

concurrency:
  group: gasi-threat-data
  cancel-in-progress: false

jobs:
  fetch-data:
    name: Ingest & Commit Threat Data
    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed to commit daily_threat_data.json back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Run static security tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run data ingestion script
        env:
          ABUSEIPDB_KEY: ${{ secrets.ABUSEIPDB_KEY }}
          OTX_API_KEY: ${{ secrets.OTX_API_KEY }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: python fetch_intel.py

      - name: Commit updated threat data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add daily_threat_data.json
          git diff --staged --quiet \
            || git commit -m "chore: update threat intelligence data [skip ci]"
          git push
